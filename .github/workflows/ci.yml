name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Dashboard preview contract
        run: npm run test:dashboard-preview

      - name: Visual regression
        run: npm run test:visual

      - name: iPhone 17 Air contract
        run: npm run test:iphone-17-air

      - name: Build
        env:
          DEMO_PIPELINE: "false"
          AUTH_PROVIDER: none
          VITE_AUTH_PROVIDER: none
          VITE_AUTH_ENABLED: "false"
        run: npm run build

      - name: Upload contract screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-screenshots
          path: screenshots/
          if-no-files-found: ignore
